[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "1.0.0"
description = "Autonomous AI Software Development Factory"
authors = [{ name = "Autonomous Architect", email = "architect@factory.local" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "cryptography>=42.0.5",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.1"
]

[project.scripts]
factory-cli = "factory.cli.main:cli"

[tool.setuptools.packages.find]
include = ["factory*"]
